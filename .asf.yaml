# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Plugin Testing"
  homepage: https://maven.apache.org/plugin-testing/
  labels:
    - java
    - build-management
    - maven-plugins
    - maven
    - hacktoberfest
  protected_branches:
    master: { }
    maven-plugin-testing-3.x: { }
  pull_requests:
    del_branch_on_merge: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  features:
    issues: true

notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-plugin-testing
project:
  metadata:
    key: maven-plugin-testing
    committee: maven
    name: Apache Maven Plugin Testing
    description: The Maven Plugin Testing contains the necessary modules to be able to test Maven Plugins.
    homepage: https://maven.apache.org/plugin-testing/
    download_page: https://maven.apache.org/plugin-testing/download.cgi
    bug_database: https://maven.apache.org/plugin-testing/issue-management.html
    mailing_lists: https://maven.apache.org/plugin-testing/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-plugin-testing
    categories:
      - build-management
    programming_languages:
      - Java
    version_method: semver
    cycle_match: (\d+)\..*
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-plugin-testing
    download_path_suffix: plugin-testing
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
